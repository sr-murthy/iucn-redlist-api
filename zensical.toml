[project]
  site_url = "https://github.com/sr-murthy/iucn-redlist-api"
  site_name = "IUCN Red List of Threatened Species API - Python Client"
  site_description = "A Python client for the IUCN Red List of Threatened Species API"
  site_author = "Sandeep R. Murthy"
  copyright = "Copyright &copy; 2026 <a href='https://github.com/sr-murthy' target='_new'>Sandeep R. Murthy</a>"
  repo_url = "https://github.com/sr-murthy/iucn-redlist-api"
  repo_name = "GitHub"
  docs_dir = "docs"
  edit_uri = "edit/main/docs/"
  site_dir = "site"

  nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started.md"},
    { "API Client Reference" = "api-client-reference.md" },
  ]

# extra_css = ["stylesheets/extra.css"]

[project.theme]
  favicon = ""
  logo = ""
  language = "en"
  features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
  ]

# Most of the settings below were automatically generated by Zensical on
# project initialisation, e.g. ``zensical new .``. Customisations to be
# made as and when required.
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
  targets.include = [
    "customization.md",
    "setup/extensions/*",
  ]

[[project.theme.palette]]
  media = "(prefers-color-scheme)"
  toggle.icon = "lucide/sun-moon"
  toggle.name = "Switch to light mode"

[[project.theme.palette]]
  media = "(prefers-color-scheme: light)"
  scheme = "default"
  toggle.icon = "lucide/sun"
  toggle.name = "Switch to dark mode"

[[project.theme.palette]]
  media = "(prefers-color-scheme: dark)"
  scheme = "slate"
  toggle.icon = "lucide/moon"
  toggle.name = "Switch to system preference"

[[project.extra.social]]
  icon = "fontawesome/brands/github"
  link = "https://github.com/sr-murthy/iucn-redlist-api"

[project.markdown_extensions]
  abbr = {}
  admonition = {}
  attr_list = {}
  def_list = {}
  footnotes = {}
  md_in_html = {}
  toc.permalink = true
  pymdownx.arithmatex.generic = true
  pymdownx.betterem = {}
  pymdownx.caret = {}
  pymdownx.details = {}
  pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
  pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
  pymdownx.highlight.anchor_linenums = true
  pymdownx.highlight.line_spans = "__span"
  pymdownx.highlight.pygments_lang_class = true
  pymdownx.inlinehilite = {}
  pymdownx.keys = {}
  pymdownx.magiclink = {}
  pymdownx.mark = {}
  pymdownx.smartsymbols = {}
  pymdownx.snippets.base_path = "includes"
  pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  ]
  pymdownx.tabbed.alternate_style = true
  pymdownx.tabbed.combine_header_slug = true
  pymdownx.tasklist.custom_checkbox = true
  pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python]
  inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://requests.readthedocs.io/en/latest/objects.inv",
  ]
  paths = ["src"]
  options.docstring_style = "numpy"
  options.inherited_members = true
  options.show_source = false
