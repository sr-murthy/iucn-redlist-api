# This workflow is designed to lint and test source code against multiple
# combinations of Python version, OS, and hardware architecture.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    env:
      PYTHONDEVMODE: 1
      API_KEY: ${{ secrets.IUCN_RED_LIST_API_KEY }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]
        install-via: [pip]
        arch: [x64]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.arch }}
        allow-prereleases: false

    - name: Install uv
      if: matrix.install-via == 'pip'
      run: |
        python3 -m pip install uv
        uv --version

    - name: Install project dependencies
      run: |
        make sync_deps_exact

    - name: Run unit tests + Measure code coverage
      run: |
        make unittests
